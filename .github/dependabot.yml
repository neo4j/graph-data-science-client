# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
registries:
  # data.pyg.org (PyG wheels) is not on Dependabot's egress allowlist; declaring
  # the host as a registry is what makes it reachable. Credentials are dummies,
  # and the url is host-only so it keeps matching the versioned index urls after
  # torch bumps.
  pyg:
    type: python-index
    url: https://data.pyg.org
    username: dummy
    password: ${{ secrets.PYG_INDEX_PASSWORD }}

updates:
  - package-ecosystem: "uv"
    directory: "/"
    registries:
      - pyg
    schedule:
      interval: "weekly"
    # torch and the PyG packages are ABI-locked to the versioned index urls in
    # pyproject.toml; they must be bumped by hand together with those urls.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torch-scatter"
      - dependency-name: "torch-sparse"
    # Batch the low-risk bumps into a single weekly PR instead of one per dependency.
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions are pinned by full SHA with a version comment; Dependabot updates
  # both. Reusable workflows pinned to a moving major tag only get major bumps.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docs toolchain (doc/package.json). No lockfile is committed, so the ranges
  # are bumped directly; .npmrc's min-release-age=3 is applied as a cooldown
  # floor automatically. antora is ignored: CI installs it via the docs-tools
  # workflow's antora-version input, not this manifest.
  - package-ecosystem: "npm"
    directory: "/doc"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "antora"
      # @neo4j-antora/tabbed-nav, force-installed by the docs-tools CI, pins its
      # peer dependency to exactly express 5.2.1; bumping express makes that
      # install fail with ERESOLVE. Drop this once the peer range is widened.
      - dependency-name: "express"
    groups:
      docs-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
