# PageRank + FastRP on a web graph (Page -LINKS-> Page).
# PageRank scores each page by importance; FastRP then builds a node embedding
# that folds the pagerank score in as an input feature (property_ratio > 0),
# mirroring the standalone notebook example. The two run in order on the same
# graph, so `pagerank` exists before FastRP consumes it. Graph: graphs/web-graph.json.
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: pages
    query: |
      MATCH (source:Page)-[rel:LINKS]->(target:Page)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })
algorithms:
  - name: pageRank
    graph_name: pages
    mode: mutate
    mutate_property: pagerank
    parameters:
      max_iterations: 20
  - name: fastRP
    graph_name: pages
    mode: mutate
    mutate_property: fastRP
    parameters:
      embedding_dimension: 8
      feature_properties: [pagerank]
      property_ratio: 0.2
      node_self_influence: 0.2
writebacks:
  - graph_name: pages
    node_properties: [pagerank, fastRP]
