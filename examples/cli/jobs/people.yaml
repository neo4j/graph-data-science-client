# Louvain community detection on a people graph (Person -KNOWS-> Person).
#   gds database upload -f graphs/people.yaml --overwrite
#   gds session  run    --file jobs/people.yaml --overwrite-graph
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: people
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })
algorithms:
  - name: louvain
    graph_name: people
    mode: mutate
    mutate_property: community
writebacks:
  - graph_name: people
    node_properties: [community]
