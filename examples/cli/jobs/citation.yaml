# PageRank + FastRP on a citation graph (Paper -CITES-> Paper): important papers
# get high rank; FastRP then embeds each paper using that rank as a feature.
#   gds database upload -f graphs/citation.yaml --overwrite
#   gds session  run    --file jobs/citation.yaml --overwrite-graph
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: citation
    query: |
      MATCH (source:Paper)-[rel:CITES]->(target:Paper)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })
algorithms:
  - name: pageRank
    graph_name: citation
    mode: mutate
    mutate_property: pagerank
    parameters:
      max_iterations: 20
  - name: fastRP
    graph_name: citation
    mode: mutate
    mutate_property: fastRP
    parameters:
      embedding_dimension: 8
      feature_properties: [pagerank]
      property_ratio: 0.2
writebacks:
  - graph_name: citation
    node_properties: [pagerank, fastRP]
