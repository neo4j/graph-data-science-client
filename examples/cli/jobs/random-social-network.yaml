# PageRank on a random power-law social network (Person -KNOWS-> Person): the
# few well-connected people surface with high rank.
#   gds database upload -f graphs/random-social-network.yaml --overwrite
#   gds session  run    --file jobs/random-social-network.yaml --overwrite-graph
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: social
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel)
      })
algorithms:
  - name: pageRank
    graph_name: social
    mode: mutate
    mutate_property: pagerank
    parameters:
      max_iterations: 20
writebacks:
  - graph_name: social
    node_properties: [pagerank]
