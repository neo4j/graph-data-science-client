# FastPath temporal embeddings over Entity -HAS_EVENT-> Event (graphs/entity-event.json).
# Labels are projected explicitly (['Entity']/['Event']): the uploader's extra `Dev`
# label would break FastPath's single-label-per-endpoint mapping.
session:
  memory: 2GB
  ttl: 30m
jobs:
  - project:
      type: cypher
      query: |
        MATCH (source:Entity)-[rel:HAS_EVENT]->(target:Event)
        RETURN gds.graph.project.remote(source, target, {
          sourceNodeProperties: source { .outputTime },
          targetNodeProperties: target { .eventTime, .eventFeatures },
          sourceNodeLabels: ['Entity'],
          targetNodeLabels: ['Event'],
          relationshipType: type(rel)
        })
    compute:
      - compute: fastpath
        config:
          resultProperty: fp_embeddings
          baseNodeLabel: Entity
          eventNodeLabel: Event
          eventFeatures: eventFeatures
          timeNodeProperty: eventTime
          outputTimeProperty: outputTime
          dimension: 8
          numElapsedTimes: 30
          maxElapsedTime: 730
          smoothingRate: 0.9
          smoothingWindow: 2
          decayFactor: 0.0
          randomSeed: 42
    # The embedding is only persisted, so it is written directly from the
    # compute result (no mutate step).
    write:
      - nodeProperty: fp_embeddings
