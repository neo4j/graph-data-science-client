# Native projection variant of the social-network job.
#
# Instead of a remote Cypher `query`, a native projection selects the graph by
# `node_labels` + `relationship_types` (read straight from the connected DB).
# Everything else (algorithms, writebacks) is identical to the remote variant.
# Graph: graphs/social-network.json  (upload with: gds database upload -f graphs/social-network.json)
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: social
    node_labels: [Person]
    relationship_types: [KNOWS]
algorithms:
  - name: louvain
    graph_name: social
    mode: mutate
    mutate_property: community
writebacks:
  - graph_name: social
    node_properties: [community]
