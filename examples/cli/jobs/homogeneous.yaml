# Job for the generated `homogeneous` graph (Node -REL-> Node).
#   gds database upload -f graphs/homogeneous.yaml --overwrite
#   gds session run --file jobs/homogeneous.yaml --overwrite-graph
session:
  name: gds-examples
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: homogeneous
    query: |
      MATCH (source:Node)-[rel:REL]->(target:Node)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: labels(source),
        targetNodeLabels: labels(target),
        relationshipType: type(rel),
        relationshipProperties: rel { .weight }
      })
algorithms:
  - name: pageRank
    graph_name: homogeneous
    mode: mutate
    mutate_property: pagerank
    parameters:
      relationship_weight_property: weight
writebacks:
  - graph_name: homogeneous
    node_properties: [pagerank]
