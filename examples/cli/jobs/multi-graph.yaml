# Two jobs projecting DIFFERENT graphs, each an isolated project → compute → write
# → drop unit: Louvain on the social graph, then PageRank on the citation graph.
# Upload both graphs first (disjoint labels, so they coexist in the DB).
session:
  memory: 2GB
  ttl: 30m
jobs:
  # Job 1 — social graph.
  - project:
      type: native
      nodeLabels: [Person]
      relationshipTypes: [KNOWS]
    compute:
      - compute: louvain
        config:
          resultProperty: community
    write:
      - nodeProperty: community

  # Job 2 — citation graph.
  - project:
      type: native
      nodeLabels: [Paper]
      relationshipTypes: [CITES]
    compute:
      - compute: pageRank
        config:
          resultProperty: pagerank
          maxIterations: 20
    write:
      - nodeProperty: pagerank
