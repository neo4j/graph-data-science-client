# Two independent graphs in one file: Person-KNOWS->Person and Page-LINKS->Page,
# with no relationships between them. `node_id_mapping: globally_unique` keeps
# Person/Page node ids from colliding (also the automatic default once there's
# more than one node label).
kind: random
nodes:
  Person:
    count: 6000
    properties:
      age: {type: uniform_int, low: 18, high: 80}
  Page:
    count: 8000
    properties:
      rank_seed: {type: uniform_int, low: 0, high: 100}
relationships:
  - source: Person
    type: KNOWS
    target: Person
    count: 240
    generator: {type: powerlaw, alpha: 0.7}
  - source: Page
    type: LINKS
    target: Page
    count: 320
    generator: {type: powerlaw, alpha: 0.9}
node_id_mapping: globally_unique
