# Single-label random graph (Node -REL-> Node); good baseline for PageRank / WCC.
kind: random
nodes:
  Node:
    count: 100
    properties:
      score: {type: gaussian}
relationships:
  - source: Node
    type: REL
    target: Node
    count: 300
    properties:
      weight: {type: gaussian, mean: 1.0}
