# Triangle Count on the social graph (two triangles), run twice with different
# parameter sets. triangleCount requires an UNDIRECTED projection, so KNOWS is
# projected undirected. Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
    undirectedRelationshipTypes:
    - KNOWS
  compute:
  - compute: triangleCount
    config:
      resultProperty: triangleCount
  - compute: triangleCount
    config:
      resultProperty: triangleCountCapped
      maxDegree: 3
  mutate:
  - nodeProperty: triangleCount
  - nodeProperty: triangleCountCapped
  write:
  - nodeProperty: triangleCount
  - nodeProperty: triangleCountCapped
