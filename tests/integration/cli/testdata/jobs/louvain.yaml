# Louvain community detection on the social graph, run twice with different
# parameter sets. Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: louvain
    config:
      resultProperty: community
  - compute: louvain
    config:
      resultProperty: communityShallow
      maxLevels: 5
      maxIterations: 5
      tolerance: 0.001
  mutate:
  - nodeProperty: community
  - nodeProperty: communityShallow
  write:
  - nodeProperty: community
  - nodeProperty: communityShallow
