# Louvain community detection on the social graph, run twice with different
# parameter sets. Also a runnable config.
session:
  name: it-cli-louvain
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: social
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
algorithms:
  - name: louvain
    graph_name: social
    mode: mutate
    mutate_property: community
  - name: louvain
    graph_name: social
    mode: mutate
    mutate_property: communityShallow
    parameters:
      max_levels: 5
      max_iterations: 5
      tolerance: 0.001
writebacks:
  - graph_name: social
    node_properties: [community, communityShallow]
