# Label Propagation on the social graph, run twice with different parameter sets.
# Also a runnable config.
session:
  name: it-cli-label-propagation
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: social
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
algorithms:
  - name: labelPropagation
    graph_name: social
    mode: mutate
    mutate_property: labelPropagationId
  - name: labelPropagation
    graph_name: social
    mode: mutate
    mutate_property: labelPropagationIdFast
    parameters:
      max_iterations: 3
      consecutive_ids: true
writebacks:
  - graph_name: social
    node_properties: [labelPropagationId, labelPropagationIdFast]
