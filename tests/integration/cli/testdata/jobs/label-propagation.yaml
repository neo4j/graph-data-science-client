# Label Propagation on the social graph, run twice with different parameter sets.
# Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: labelPropagation
    config:
      resultProperty: labelPropagationId
  - compute: labelPropagation
    config:
      resultProperty: labelPropagationIdFast
      maxIterations: 3
      consecutiveIds: true
  mutate:
  - nodeProperty: labelPropagationId
  - nodeProperty: labelPropagationIdFast
  write:
  - nodeProperty: labelPropagationId
  - nodeProperty: labelPropagationIdFast
