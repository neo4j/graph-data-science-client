# Degree centrality on the social graph, run twice with different parameter sets
# (natural vs reverse orientation). Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: degree
    config:
      resultProperty: degree
  - compute: degree
    config:
      resultProperty: degreeReverse
      orientation: REVERSE
  mutate:
  - nodeProperty: degree
  - nodeProperty: degreeReverse
  write:
  - nodeProperty: degree
  - nodeProperty: degreeReverse
