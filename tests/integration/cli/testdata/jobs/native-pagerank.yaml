# PageRank on a NATIVE projection of the social graph (selected by node labels +
# relationship types instead of a remote Cypher query). Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: native
    nodeLabels:
    - Person
    relationshipTypes:
    - KNOWS
  compute:
  - compute: pageRank
    config:
      resultProperty: pagerank
      maxIterations: 20
  mutate:
  - nodeProperty: pagerank
  write:
  - nodeProperty: pagerank
