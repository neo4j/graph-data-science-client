# PageRank on the social graph, run twice with different parameter sets to check
# parametrization works. Also a runnable `gds session run` config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: pageRank
    config:
      resultProperty: pagerank
      maxIterations: 20
  - compute: pageRank
    config:
      resultProperty: pagerankDamped
      dampingFactor: 0.5
      maxIterations: 10
      tolerance: 0.001
  mutate:
  - nodeProperty: pagerank
  - nodeProperty: pagerankDamped
  write:
  - nodeProperty: pagerank
  - nodeProperty: pagerankDamped
