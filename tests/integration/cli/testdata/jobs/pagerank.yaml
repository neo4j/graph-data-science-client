# PageRank on the social graph, run twice with different parameter sets to check
# parametrization works. Also a runnable `gds session run` config.
session:
  name: it-cli-pagerank
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: social
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
algorithms:
  - name: pageRank
    graph_name: social
    mode: mutate
    mutate_property: pagerank
    parameters:
      max_iterations: 20
  - name: pageRank
    graph_name: social
    mode: mutate
    mutate_property: pagerankDamped
    parameters:
      damping_factor: 0.5
      max_iterations: 10
      tolerance: 0.001
writebacks:
  - graph_name: social
    node_properties: [pagerank, pagerankDamped]
