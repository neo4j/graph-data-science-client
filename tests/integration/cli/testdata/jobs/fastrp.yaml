# FastRP node embeddings on the social graph, run twice with different parameter
# sets (dimension + normalization). Writes array properties back. Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: fastRP
    config:
      resultProperty: fastRP
      embeddingDimension: 8
  - compute: fastRP
    config:
      resultProperty: fastRP16
      embeddingDimension: 16
      normalizationStrength: 0.5
      iterationWeights:
      - 0.0
      - 1.0
      - 1.0
      - 1.0
  mutate:
  - nodeProperty: fastRP
  - nodeProperty: fastRP16
  write:
  - nodeProperty: fastRP
  - nodeProperty: fastRP16
