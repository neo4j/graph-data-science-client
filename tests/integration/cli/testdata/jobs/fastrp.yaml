# FastRP node embeddings on the social graph, run twice with different parameter
# sets (dimension + normalization). Writes array properties back. Also a runnable config.
session:
  name: it-cli-fastrp
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: social
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
algorithms:
  - name: fastRP
    graph_name: social
    mode: mutate
    mutate_property: fastRP
    parameters:
      embedding_dimension: 8
  - name: fastRP
    graph_name: social
    mode: mutate
    mutate_property: fastRP16
    parameters:
      embedding_dimension: 16
      normalization_strength: 0.5
      iteration_weights: [0.0, 1.0, 1.0, 1.0]
writebacks:
  - graph_name: social
    node_properties: [fastRP, fastRP16]
