# FastRP on a NATIVE projection that also loads a node property (`age`), which
# FastRP then consumes as a feature. Exercises native `node_properties`. Also a
# runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: native
    nodeLabels:
    - Person
    relationshipTypes:
    - KNOWS
    nodeProperties:
    - age
  compute:
  - compute: fastRP
    config:
      resultProperty: fastRP
      embeddingDimension: 8
      featureProperties:
      - age
      propertyRatio: 0.5
  mutate:
  - nodeProperty: fastRP
  write:
  - nodeProperty: fastRP
