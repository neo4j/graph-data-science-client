# Eigenvector centrality on the social graph, run twice with different parameter
# sets. Also a runnable config.
session:
  name: it-cli-eigenvector
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: social
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
algorithms:
  - name: eigenvector
    graph_name: social
    mode: mutate
    mutate_property: eigenvector
  - name: eigenvector
    graph_name: social
    mode: mutate
    mutate_property: eigenvectorTuned
    parameters:
      max_iterations: 10
      tolerance: 0.001
writebacks:
  - graph_name: social
    node_properties: [eigenvector, eigenvectorTuned]
