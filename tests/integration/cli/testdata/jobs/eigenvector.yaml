# Eigenvector centrality on the social graph, run twice with different parameter
# sets. Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: eigenvector
    config:
      resultProperty: eigenvector
  - compute: eigenvector
    config:
      resultProperty: eigenvectorTuned
      maxIterations: 10
      tolerance: 0.001
  mutate:
  - nodeProperty: eigenvector
  - nodeProperty: eigenvectorTuned
  write:
  - nodeProperty: eigenvector
  - nodeProperty: eigenvectorTuned
