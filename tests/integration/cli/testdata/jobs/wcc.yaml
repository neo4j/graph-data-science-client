# Weakly Connected Components on the social graph, run twice with different
# parameter sets. Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: wcc
    config:
      resultProperty: componentId
  - compute: wcc
    config:
      resultProperty: componentIdC2
      concurrency: 2
      threshold: 0.0
  mutate:
  - nodeProperty: componentId
  - nodeProperty: componentIdC2
  write:
  - nodeProperty: componentId
  - nodeProperty: componentIdC2
