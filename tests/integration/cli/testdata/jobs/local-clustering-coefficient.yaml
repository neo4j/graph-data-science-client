# Local Clustering Coefficient on the social graph, run twice with different
# parameter sets. localClusteringCoefficient requires an UNDIRECTED projection,
# so KNOWS is projected undirected. Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
    undirectedRelationshipTypes:
    - KNOWS
  compute:
  - compute: localClusteringCoefficient
    config:
      resultProperty: localClusteringCoefficient
  - compute: localClusteringCoefficient
    config:
      resultProperty: localClusteringCoefficientC2
      concurrency: 2
  mutate:
  - nodeProperty: localClusteringCoefficient
  - nodeProperty: localClusteringCoefficientC2
  write:
  - nodeProperty: localClusteringCoefficient
  - nodeProperty: localClusteringCoefficientC2
