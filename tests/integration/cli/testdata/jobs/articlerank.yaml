# ArticleRank on the social graph, run twice with different parameter sets.
# Also a runnable `gds session run` config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: articleRank
    config:
      resultProperty: articleRank
  - compute: articleRank
    config:
      resultProperty: articleRankTuned
      dampingFactor: 0.75
      maxIterations: 15
  mutate:
  - nodeProperty: articleRank
  - nodeProperty: articleRankTuned
  write:
  - nodeProperty: articleRank
  - nodeProperty: articleRankTuned
