# ArticleRank on the social graph, run twice with different parameter sets.
# Also a runnable `gds session run` config.
session:
  name: it-cli-articlerank
  memory: 2GB
  ttl_minutes: 30
projections:
  - graph_name: social
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
algorithms:
  - name: articleRank
    graph_name: social
    mode: mutate
    mutate_property: articleRank
  - name: articleRank
    graph_name: social
    mode: mutate
    mutate_property: articleRankTuned
    parameters:
      damping_factor: 0.75
      max_iterations: 15
writebacks:
  - graph_name: social
    node_properties: [articleRank, articleRankTuned]
