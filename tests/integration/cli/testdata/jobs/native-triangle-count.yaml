# Triangle Count on a NATIVE projection with KNOWS treated as UNDIRECTED
# (triangleCount rejects directed graphs). Exercises native projection +
# undirected_relationship_types together. Also a runnable config.
# graphs: social
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: native
    nodeLabels:
    - Person
    relationshipTypes:
    - KNOWS
    undirectedRelationshipTypes:
    - KNOWS
  compute:
  - compute: triangleCount
    config:
      resultProperty: triangleCount
  mutate:
  - nodeProperty: triangleCount
  write:
  - nodeProperty: triangleCount
