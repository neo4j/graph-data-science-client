# One job that projects TWO independent graphs and runs a different algorithm on
# each. `run_all` handles each graph as its own isolated unit of work (project ->
# run -> write back -> drop) before moving to the next. The two graphs use disjoint
# labels/relationship types (Person/KNOWS vs Page/LINKS) so they never interfere.
# Also a runnable `gds session run` config.
# graphs: social, web
session:
  memory: 2GB
  ttl: 30m
jobs:
- project:
    type: cypher
    query: |
      MATCH (source:Person)-[rel:KNOWS]->(target:Person)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Person'],
        targetNodeLabels: ['Person'],
        relationshipType: type(rel)
      })
  compute:
  - compute: louvain
    config:
      resultProperty: community
  mutate:
  - nodeProperty: community
  write:
  - nodeProperty: community
- project:
    type: cypher
    query: |
      MATCH (source:Page)-[rel:LINKS]->(target:Page)
      RETURN gds.graph.project.remote(source, target, {
        sourceNodeLabels: ['Page'],
        targetNodeLabels: ['Page'],
        relationshipType: type(rel)
      })
  compute:
  - compute: pageRank
    config:
      resultProperty: rank
      maxIterations: 20
  mutate:
  - nodeProperty: rank
  write:
  - nodeProperty: rank
